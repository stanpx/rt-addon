name: Build CloudStream Plugins

concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - 'cloudstream/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: "builds"
          path: "builds"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src/cloudstream
          chmod +x gradlew
          ./gradlew make makePluginsJson || ./gradlew make
          mkdir -p $GITHUB_WORKSPACE/builds
          cp -f build/*.cs3 $GITHUB_WORKSPACE/builds/ 2>/dev/null || cp -f **/build/*.cs3 $GITHUB_WORKSPACE/builds/ 2>/dev/null || true
          if [ -f build/plugins.json ]; then
            cp -f build/plugins.json $GITHUB_WORKSPACE/builds/
          else
            cp -f $GITHUB_WORKSPACE/src/plugins.json $GITHUB_WORKSPACE/builds/
          fi

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git init
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git checkout -B builds
          git add .
          git commit -m "Build $GITHUB_SHA" || exit 0
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git 2>/dev/null || true
          git push -u origin builds --force
