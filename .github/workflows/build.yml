name: Build CloudStream Plugins

concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - 'cloudstream/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Accept Android Licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build Plugins
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd $GITHUB_WORKSPACE/src/cloudstream
          chmod +x gradlew
          ./gradlew make makePluginsJson || ./gradlew make

      - name: Deploy to builds branch
        run: |
          mkdir -p $GITHUB_WORKSPACE/deploy
          cd $GITHUB_WORKSPACE/deploy

          # Copiar paquetes compilados
          cp -f $GITHUB_WORKSPACE/src/cloudstream/build/*.cs3 RTProvider.cs3 2>/dev/null || true
          cp -f $GITHUB_WORKSPACE/src/cloudstream/build/*.cs3 rt-addon.cs3 2>/dev/null || true
          
          # Copiar lista de plugins
          if [ -f $GITHUB_WORKSPACE/src/cloudstream/build/plugins.json ]; then
            cp -f $GITHUB_WORKSPACE/src/cloudstream/build/plugins.json plugins.json
          else
            cp -f $GITHUB_WORKSPACE/src/plugins.json plugins.json
          fi

          git init
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git checkout -B builds
          git add -f *
          git commit -m "Deploy CloudStream build $GITHUB_SHA" || exit 0
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -u origin builds --force
